name: jobmap
description: "JobMap - Smart Career Platform for Iraq"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.9.0

  # Web support for JS Interop
  web: ^1.1.0

  # Maps
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  permission_handler: ^12.0.1

  # State Management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Secure Storage
  flutter_secure_storage: ^10.3.1

  # Dependency Injection
  get_it: ^8.2.0

  # UI & Design
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Navigation
  go_router: ^13.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.6
  freezed: ^2.4.5
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700